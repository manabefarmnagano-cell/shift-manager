<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト管理アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232738;
    --border: #2e3348;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --accent3: #f59e0b;
    --text: #e8eaf0;
    --muted: #7a7f9a;
    --danger: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header span { font-size: 11px; color: var(--muted); margin-top: 2px; }

  nav {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav button {
    flex: 1;
    padding: 12px 8px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    min-width: 80px;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  main { padding: 16px; max-width: 600px; margin: 0 auto; }

  .page { display: none; }
  .page.active { display: block; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Inputs */
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent2); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field { margin-bottom: 12px; }

  /* Buttons */
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #0f1117; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 11px; }
  .btn-full { width: 100%; }

  /* Employee list */
  .emp-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .emp-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .emp-info { flex: 1; }
  .emp-name { font-weight: 600; font-size: 14px; }
  .emp-wage { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
  .emp-actions { display: flex; gap: 6px; }

  /* Attendance */
  .today-card {
    background: linear-gradient(135deg, #1a2e1a, #1a2738);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
  }
  .clock-display {
    font-family: 'DM Mono', monospace;
    font-size: 36px;
    font-weight: 500;
    color: var(--accent);
    margin: 8px 0;
  }
  .date-display { font-size: 12px; color: var(--muted); }

  .att-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .att-name { flex: 1; font-size: 13px; font-weight: 500; }
  .att-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .status-dot.in { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.out { background: var(--accent2); }

  /* Records */
  .rec-item {
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rec-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 55px; flex-shrink: 0; }
  .rec-name { font-size: 13px; font-weight: 500; flex: 1; }
  .rec-hours { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); }
  .rec-del { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .rec-del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }

  /* Salary */
  .salary-card {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .salary-name { font-weight: 600; margin-bottom: 8px; }
  .salary-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .salary-total {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 16px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .month-selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    background: var(--surface2);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .month-selector button {
    background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 4px 8px;
  }
  .month-selector span { font-weight: 600; font-size: 14px; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 600px;
    border-top: 1px solid var(--border);
  }
  .modal h3 { font-size: 15px; margin-bottom: 16px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-btns .btn { flex: 1; }

  /* Tag/badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-green { background: rgba(74,222,128,0.15); color: var(--accent); }
  .badge-blue { background: rgba(34,211,238,0.15); color: var(--accent2); }

  .empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--accent);
    color: #0f1117;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 99px;
    z-index: 999;
    transition: transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .section-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 8px; margin-top: 16px;
  }

  .colors { --c1:#4ade80;--c2:#22d3ee;--c3:#f59e0b;--c4:#a78bfa;--c5:#fb7185; }
</style>
</head>
<body>
<header>
  <div class="logo">⏱</div>
  <div>
    <h1>シフト管理</h1>
    <span>アルバイト勤怠・給与管理</span>
  </div>
</header>

<nav>
  <button class="active" onclick="showPage('attendance')">📅 出退勤</button>
  <button onclick="showPage('records')">📋 記録</button>
  <button onclick="showPage('salary')">💴 給与</button>
  <button onclick="showPage('employees')">👤 従業員</button>
</nav>

<main>
  <!-- 出退勤ページ -->
  <div class="page active" id="page-attendance">
    <div class="today-card">
      <div class="date-display" id="date-display"></div>
      <div class="clock-display" id="clock-display">--:--:--</div>
      <div class="badge badge-green">リアルタイム</div>
    </div>

    <div class="card">
      <div class="card-title">打刻する</div>
      <div class="field">
        <label>従業員を選択</label>
        <select id="att-emp-select">
          <option value="">-- 選択してください --</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="clockIn()">🟢 出勤</button>
        <button class="btn btn-secondary" style="flex:1" onclick="clockOut()">🔴 退勤</button>
      </div>
    </div>

    <div class="section-label">本日の状況</div>
    <div id="today-status"></div>
  </div>

  <!-- 記録ページ -->
  <div class="page" id="page-records">
    <div class="card">
      <div class="card-title">勤務記録を追加</div>
      <div class="field">
        <label>従業員</label>
        <select id="rec-emp-select"></select>
      </div>
      <div class="field">
        <label>日付</label>
        <input type="date" id="rec-date">
      </div>
      <div style="display:flex;gap:8px;" class="field">
        <div style="flex:1">
          <label>出勤時刻</label>
          <input type="time" id="rec-in">
        </div>
        <div style="flex:1">
          <label>退勤時刻</label>
          <input type="time" id="rec-out">
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="addRecord()">記録を追加</button>
    </div>

    <div class="section-label">勤務記録一覧</div>
    <div class="field" style="display:flex;gap:8px;margin-bottom:8px;">
      <select id="filter-emp" style="flex:1" onchange="renderRecords()">
        <option value="">全員</option>
      </select>
      <input type="month" id="filter-month" style="flex:1" onchange="renderRecords()">
    </div>
    <div id="records-list"></div>
  </div>

  <!-- 給与ページ -->
  <div class="page" id="page-salary">
    <div class="month-selector">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="salary-month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div id="salary-list"></div>
  </div>

  <!-- 従業員ページ -->
  <div class="page" id="page-employees">
    <div class="card">
      <div class="card-title" id="emp-form-title">従業員を追加</div>
      <div class="field">
        <label>名前</label>
        <input type="text" id="emp-name" placeholder="例: 山田 太郎">
      </div>
      <div class="field">
        <label>時給（円）</label>
        <input type="number" id="emp-wage" placeholder="例: 1050">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="saveEmployee()" id="emp-save-btn">追加する</button>
        <button class="btn btn-secondary btn-sm" id="emp-cancel-btn" style="display:none" onclick="cancelEdit()">キャンセル</button>
      </div>
    </div>
    <div class="section-label">従業員一覧</div>
    <div id="employees-list"></div>
  </div>
</main>

<!-- Modal for editing -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>記録を編集</h3>
    <input type="hidden" id="edit-rec-id">
    <div class="field">
      <label>日付</label>
      <input type="date" id="edit-date">
    </div>
    <div style="display:flex;gap:8px;" class="field">
      <div style="flex:1"><label>出勤</label><input type="time" id="edit-in"></div>
      <div style="flex:1"><label>退勤</label><input type="time" id="edit-out"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Data ────────────────────────────────────────────
const COLORS = ['#4ade80','#22d3ee','#f59e0b','#a78bfa','#fb7185'];

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
}
function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

let employees = load('employees');
let records = load('records');

// activeClockIns: {empId: isoString}
let activeClockIns = JSON.parse(localStorage.getItem('activeClockIns') || '{}');

// salary view month
let salaryYear = new Date().getFullYear();
let salaryMonth = new Date().getMonth(); // 0-indexed

let editingEmpId = null;

// ─── Clock ───────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock-display').textContent =
    now.toLocaleTimeString('ja-JP');
  document.getElementById('date-display').textContent =
    now.toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
}
setInterval(updateClock, 1000);
updateClock();

// ─── Navigation ──────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'records') renderRecords();
  if (id === 'salary') renderSalary();
  if (id === 'employees') renderEmployees();
  if (id === 'attendance') renderTodayStatus();
}

// ─── Toast ────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Employees ───────────────────────────────────────
function getColor(i) { return COLORS[i % COLORS.length]; }

function renderEmployeeSelects() {
  const selects = ['att-emp-select','rec-emp-select','filter-emp'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = sel.value;
    const prefix = id === 'filter-emp' ? '<option value="">全員</option>' : '<option value="">-- 選択 --</option>';
    sel.innerHTML = prefix + employees.map(e =>
      `<option value="${e.id}">${e.name}</option>`).join('');
    sel.value = cur;
  });
}

function renderEmployees() {
  const list = document.getElementById('employees-list');
  if (!employees.length) { list.innerHTML = '<div class="empty">従業員がいません</div>'; return; }
  list.innerHTML = employees.map((e, i) => `
    <div class="emp-item">
      <div class="emp-avatar" style="background:${getColor(i)}22;color:${getColor(i)}">${e.name[0]}</div>
      <div class="emp-info">
        <div class="emp-name">${e.name}</div>
        <div class="emp-wage">¥${Number(e.wage).toLocaleString()} / 時</div>
      </div>
      <div class="emp-actions">
        <button class="btn btn-secondary btn-sm" onclick="editEmployee('${e.id}')">編集</button>
        <button class="btn btn-sm" style="background:rgba(248,113,113,0.15);color:#f87171" onclick="deleteEmployee('${e.id}')">削除</button>
      </div>
    </div>
  `).join('');
}

function saveEmployee() {
  const name = document.getElementById('emp-name').value.trim();
  const wage = parseInt(document.getElementById('emp-wage').value);
  if (!name) { showToast('名前を入力してください'); return; }
  if (!wage || wage < 1) { showToast('時給を入力してください'); return; }

  if (editingEmpId) {
    employees = employees.map(e => e.id === editingEmpId ? {...e, name, wage} : e);
    showToast('従業員情報を更新しました');
    cancelEdit();
  } else {
    employees.push({ id: Date.now().toString(), name, wage });
    showToast(`${name} を追加しました`);
  }
  save('employees', employees);
  document.getElementById('emp-name').value = '';
  document.getElementById('emp-wage').value = '';
  renderEmployees();
  renderEmployeeSelects();
}

function editEmployee(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  editingEmpId = id;
  document.getElementById('emp-name').value = e.name;
  document.getElementById('emp-wage').value = e.wage;
  document.getElementById('emp-form-title').textContent = '従業員を編集';
  document.getElementById('emp-save-btn').textContent = '保存する';
  document.getElementById('emp-cancel-btn').style.display = 'inline-block';
  document.getElementById('page-employees').scrollTop = 0;
}

function cancelEdit() {
  editingEmpId = null;
  document.getElementById('emp-name').value = '';
  document.getElementById('emp-wage').value = '';
  document.getElementById('emp-form-title').textContent = '従業員を追加';
  document.getElementById('emp-save-btn').textContent = '追加する';
  document.getElementById('emp-cancel-btn').style.display = 'none';
}

function deleteEmployee(id) {
  const e = employees.find(x => x.id === id);
  if (!confirm(`${e.name} を削除しますか？`)) return;
  employees = employees.filter(x => x.id !== id);
  save('employees', employees);
  renderEmployees();
  renderEmployeeSelects();
  showToast('削除しました');
}

// ─── Attendance ───────────────────────────────────────
function clockIn() {
  const id = document.getElementById('att-emp-select').value;
  if (!id) { showToast('従業員を選択してください'); return; }
  if (activeClockIns[id]) { showToast('すでに出勤中です'); return; }
  activeClockIns[id] = new Date().toISOString();
  localStorage.setItem('activeClockIns', JSON.stringify(activeClockIns));
  const e = employees.find(x => x.id === id);
  showToast(`${e.name} 出勤しました 🟢`);
  renderTodayStatus();
}

function clockOut() {
  const id = document.getElementById('att-emp-select').value;
  if (!id) { showToast('従業員を選択してください'); return; }
  if (!activeClockIns[id]) { showToast('出勤記録がありません'); return; }
  const inTime = new Date(activeClockIns[id]);
  const outTime = new Date();
  const rec = {
    id: Date.now().toString(),
    empId: id,
    date: inTime.toISOString().slice(0,10),
    in: inTime.toTimeString().slice(0,5),
    out: outTime.toTimeString().slice(0,5),
  };
  records.push(rec);
  save('records', records);
  delete activeClockIns[id];
  localStorage.setItem('activeClockIns', JSON.stringify(activeClockIns));
  const e = employees.find(x => x.id === id);
  const hours = calcHours(rec.in, rec.out).toFixed(1);
  showToast(`${e.name} 退勤 ${hours}h 🔴`);
  renderTodayStatus();
}

function renderTodayStatus() {
  const today = new Date().toISOString().slice(0,10);
  const div = document.getElementById('today-status');
  if (!employees.length) { div.innerHTML = '<div class="empty">従業員を先に追加してください</div>'; return; }
  div.innerHTML = employees.map((e, i) => {
    const isIn = !!activeClockIns[e.id];
    const todayRecs = records.filter(r => r.empId === e.id && r.date === today);
    const times = todayRecs.map(r => `${r.in}〜${r.out}`).join(', ');
    return `
      <div class="att-row">
        <div class="status-dot ${isIn ? 'in' : (todayRecs.length ? 'out' : '')}"></div>
        <div class="emp-avatar" style="width:28px;height:28px;font-size:12px;background:${getColor(i)}22;color:${getColor(i)}">${e.name[0]}</div>
        <div class="att-name">${e.name}</div>
        <div class="att-time">${isIn ? '出勤中 ' + activeClockIns[e.id].slice(11,16) : (times || '-')}</div>
        ${isIn ? `<span class="badge badge-green">IN</span>` : (todayRecs.length ? `<span class="badge badge-blue">${calcDayHours(e.id, today).toFixed(1)}h</span>` : '')}
      </div>
    `;
  }).join('');
}

function calcDayHours(empId, date) {
  return records.filter(r => r.empId === empId && r.date === date)
    .reduce((s, r) => s + calcHours(r.in, r.out), 0);
}

// ─── Records ──────────────────────────────────────────
function calcHours(inTime, outTime) {
  const [ih, im] = inTime.split(':').map(Number);
  const [oh, om] = outTime.split(':').map(Number);
  let mins = (oh * 60 + om) - (ih * 60 + im);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function addRecord() {
  const empId = document.getElementById('rec-emp-select').value;
  const date = document.getElementById('rec-date').value;
  const inT = document.getElementById('rec-in').value;
  const outT = document.getElementById('rec-out').value;
  if (!empId || !date || !inT || !outT) { showToast('全ての項目を入力してください'); return; }
  records.push({ id: Date.now().toString(), empId, date, in: inT, out: outT });
  save('records', records);
  document.getElementById('rec-date').value = '';
  document.getElementById('rec-in').value = '';
  document.getElementById('rec-out').value = '';
  showToast('記録を追加しました');
  renderRecords();
}

function renderRecords() {
  const filterEmp = document.getElementById('filter-emp').value;
  const filterMonth = document.getElementById('filter-month').value;
  let filtered = [...records];
  if (filterEmp) filtered = filtered.filter(r => r.empId === filterEmp);
  if (filterMonth) filtered = filtered.filter(r => r.date.startsWith(filterMonth));
  filtered.sort((a,b) => b.date.localeCompare(a.date));
  const list = document.getElementById('records-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty">記録がありません</div>'; return; }
  list.innerHTML = filtered.map(r => {
    const e = employees.find(x => x.id === r.empId);
    const h = calcHours(r.in, r.out);
    const empIdx = employees.indexOf(e);
    return `
      <div class="rec-item">
        <div class="rec-date">${r.date.slice(5)}</div>
        <div class="emp-avatar" style="width:24px;height:24px;font-size:11px;flex-shrink:0;background:${getColor(empIdx)}22;color:${getColor(empIdx)}">${e ? e.name[0] : '?'}</div>
        <div class="rec-name">${e ? e.name : '不明'}</div>
        <div class="rec-hours">${r.in}〜${r.out}<br><span style="color:var(--muted)">${h.toFixed(1)}h</span></div>
        <button class="rec-del" onclick="openEditModal('${r.id}')">✏️</button>
        <button class="rec-del" onclick="deleteRecord('${r.id}')">🗑</button>
      </div>
    `;
  }).join('');
}

function deleteRecord(id) {
  if (!confirm('この記録を削除しますか？')) return;
  records = records.filter(r => r.id !== id);
  save('records', records);
  renderRecords();
  showToast('削除しました');
}

function openEditModal(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  document.getElementById('edit-rec-id').value = id;
  document.getElementById('edit-date').value = r.date;
  document.getElementById('edit-in').value = r.in;
  document.getElementById('edit-out').value = r.out;
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }
function saveEdit() {
  const id = document.getElementById('edit-rec-id').value;
  records = records.map(r => r.id === id ? {
    ...r,
    date: document.getElementById('edit-date').value,
    in: document.getElementById('edit-in').value,
    out: document.getElementById('edit-out').value,
  } : r);
  save('records', records);
  closeModal();
  renderRecords();
  showToast('更新しました');
}

// ─── Salary ───────────────────────────────────────────
function changeMonth(delta) {
  salaryMonth += delta;
  if (salaryMonth > 11) { salaryMonth = 0; salaryYear++; }
  if (salaryMonth < 0) { salaryMonth = 11; salaryYear--; }
  renderSalary();
}

function renderSalary() {
  const label = `${salaryYear}年${salaryMonth+1}月`;
  document.getElementById('salary-month-label').textContent = label;
  const prefix = `${salaryYear}-${String(salaryMonth+1).padStart(2,'0')}`;
  const list = document.getElementById('salary-list');
  if (!employees.length) { list.innerHTML = '<div class="empty">従業員がいません</div>'; return; }
  let html = '';
  let grandTotal = 0;
  employees.forEach((e, i) => {
    const recs = records.filter(r => r.empId === e.id && r.date.startsWith(prefix));
    const totalH = recs.reduce((s, r) => s + calcHours(r.in, r.out), 0);
    const pay = Math.round(totalH * e.wage);
    grandTotal += pay;
    html += `
      <div class="salary-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div class="emp-avatar" style="width:30px;height:30px;font-size:13px;background:${getColor(i)}22;color:${getColor(i)}">${e.name[0]}</div>
          <div class="salary-name">${e.name}</div>
        </div>
        <div class="salary-row"><span>時給</span><span>¥${Number(e.wage).toLocaleString()}</span></div>
        <div class="salary-row"><span>勤務回数</span><span>${recs.length}回</span></div>
        <div class="salary-row"><span>合計勤務時間</span><span>${totalH.toFixed(1)}時間</span></div>
        <div class="salary-total"><span>支給額</span><span>¥${pay.toLocaleString()}</span></div>
      </div>
    `;
  });
  html += `
    <div class="card" style="text-align:center">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">合計支給額</div>
      <div style="font-family:'DM Mono',monospace;font-size:28px;font-weight:700;color:var(--accent)">¥${grandTotal.toLocaleString()}</div>
    </div>
  `;
  list.innerHTML = html;
}

// ─── Init ─────────────────────────────────────────────
function init() {
  // Set default date for records
  document.getElementById('rec-date').value = new Date().toISOString().slice(0,10);
  // Set default filter month
  document.getElementById('filter-month').value = new Date().toISOString().slice(0,7);
  renderEmployeeSelects();
  renderTodayStatus();
  renderSalary();
}

init();
</script>
